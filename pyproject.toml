[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-agent"
version = "0.2.0"
description = "PA Agent Web: account-isolated price action analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "PA Agent Team" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "openai>=1.40,<4",
    "tiktoken>=0.7,<1",
    "jsonschema>=4.22,<5",
    "pydantic>=2.7,<3",
    "cryptography>=42",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1",
    "httpx>=0.28,<1",
    "yfinance>=0.2.54,<2",
    "requests>=2.32,<3",
    "akshare>=1.14,<2",
    "baostock>=0.8,<1",
    "tushare>=1.4,<2",
    "tvdatafeed @ https://github.com/rongardF/tvdatafeed/archive/e6f6aaa7de439ac6e454d9b26d2760ded8dc4923.zip",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5"]

[project.scripts]
pa-agent = "pa_agent.main:main"

[tool.vercel]
entrypoint = "app:app"

[tool.setuptools.packages.find]
include = ["pa_agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: unit-level tests",
    "property: property-based tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "live: requires real API credentials",
]
