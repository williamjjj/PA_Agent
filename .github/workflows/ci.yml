name: Web CI
on:
  push:
    branches: [main, "v0/python-4aa3dbb3", "codex/web-multiuser-vercel"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked web dependencies
        run: uv sync --locked --extra dev
      - name: Verify ASGI entry and headless imports
        run: uv run python -c "from app import app; import sys; assert callable(app); assert 'PyQt6' not in sys.modules"
      - name: Web and core request regression gate
        run: >
          uv run pytest tests/web
          tests/integration/test_two_stage_happy_path.py
          tests/integration/test_two_stage_network_timeout.py
          tests/integration/test_two_stage_user_cancel.py
          tests/integration/test_two_stage_stage1_syntax.py
          tests/integration/test_two_stage_stage1_missing_field.py
          tests/integration/test_two_stage_stage2_invalid_value.py
          tests/unit/test_tushare_source.py
          tests/unit/test_chart_decision_overlay.py
          tests/unit/test_order_opportunity.py
          tests/unit/test_snapshot_closed_only_buffer.py
          tests/unit/test_snapshot_indicator_warmup.py
      - name: Full inherited regression report (known baseline failures)
        id: legacy
        continue-on-error: true
        run: uv run pytest tests -m "not live" --junitxml=legacy-regression.xml
      - name: Preserve inherited regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inherited-regression
          path: legacy-regression.xml
      - name: Streaming parser regression tests
        run: node --test tests/web/test_stream.mjs
      - name: Check runtime errors
        run: uv run ruff check pa_agent/web tests/web pa_agent/bridge.py --select E9,F63,F7,F82
