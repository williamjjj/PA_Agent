name: Web CI
on:
  push:
    branches: [main, "v0/python-4aa3dbb3", "codex/web-multiuser-vercel"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked web dependencies
        run: uv sync --locked --extra dev
      - name: Verify ASGI entry and headless imports
        run: uv run python -c "from app import app; import sys; assert callable(app); assert 'PyQt6' not in sys.modules"
      - name: Full regression gate
        run: uv run --no-sync pytest tests -m "not live" --junitxml=regression.xml
      - name: Preserve regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression
          path: regression.xml
      - name: Streaming parser regression tests
        run: node --test tests/web/test_stream.mjs
      - name: Check runtime errors
        run: uv run ruff check pa_agent/web tests/web pa_agent/bridge.py --select E9,F63,F7,F82
